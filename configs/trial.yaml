# Trial config. Values are illustrative starting points, not validated settings.
# Supply paths via MODEL_PATH / DATASET_PATH (or --model-path / --dataset-path).

model:
  name: "OLMo-3.1-32B-Think"
  path: null

dataset:
  path: null          # JSONL file with "prompt" and "answer" fields
  max_samples: 16

training:
  seed: 42
  max_steps: 3
  learning_rate: 1.0e-5
  # GRPO needs batch_size * grad_accum divisible by num_generations, so 2 (not 1).
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 1
  num_generations: 2
  # The Think model used 1.5k-2.4k tokens on simple probability prompts; at 512 it
  # rarely reaches </think>, so every reward would be 0.
  max_completion_length: 2048
  beta: 0.01

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

verify:
  prompt: "What is 2 + 2? Answer with a single number."
  max_new_tokens: 64

output:
  dir: "results/trial"
