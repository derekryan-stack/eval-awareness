# Short trial of the shared pipeline, using the hyperparameters validated by the preliminary
# CoT-length run (configs/prob_cot_length.yaml: 100 steps on 1x H200 in 3.5 h, 2026-10-20) with
# the task reward only and 5 steps (~10-15 min of training plus model loading).
#
# Machine-specific paths come from the environment (see src/config.py):
#   MODEL_PATH=weights/Olmo-3.1-32B-Think DATASET_PATH=data/prob_train.jsonl
# data/prob_train.jsonl is generated by scripts/make_prob_data.py (scripts/submit_experiment.sh
# does this automatically if it is missing).

experiment:
  name: trial
  description: "Pipeline trial: task reward on probability problems, validated hyperparameters, 5 steps."

model:
  name: "OLMo-3.1-32B-Think"
  path: null

dataset:
  path: data/prob_train.jsonl   # DATASET_PATH overrides
  max_samples: 100

training:
  seed: 42
  max_steps: 5
  learning_rate: 1.0e-4
  # 8 completions per step = 2 prompts x 4 generations.
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  num_generations: 4
  max_prompt_length: 512
  # The base model used ~1.5k-2.4k reasoning tokens on these problems; 3072 leaves headroom.
  max_completion_length: 3072
  temperature: 0.6
  beta: 0.01

rewards:
  - name: task
    weight: 1.0

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

logging:
  logging_steps: 1

verify:
  prompt: "What is 2 + 2? Answer with a single number."
  max_new_tokens: 64

output:
  root: results
